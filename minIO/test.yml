
services:
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
      - MINIO_SERVER_URL=http://minio.sinawic.com:9000
      - MINIO_BROWSER_REDIRECT_URL=http://minio.sinawic.com:9001
      - MINIO_DOMAIN=sinawic.com
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"