{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockage Cloud - Galerie de Médias</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css'%}">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>
                    <i class="fas fa-cloud"></i>
                    CloudStorage
                </h2>
            </div>

            <div class="sidebar-section">
                <button class="sidebar-item active" data-type="all">
                    <i class="fas fa-folder"></i>
                    <span>Tous</span>
                </button>
            </div>

            <div class="sidebar-section">
                <h3>Explorer</h3>
                <button class="sidebar-item">
                    <i class="fas fa-folder"></i>
                    <span>Dossiers</span>
                </button>
                <button class="sidebar-item">
                    <i class="fas fa-history"></i>
                    <span>Historique</span>
                </button>
                <button class="sidebar-item">
                    <i class="fas fa-trash"></i>
                    <span>Trash</span>
                </button>
            </div>

            <div class="sidebar-section">
                <h3>Catégories</h3>
                <button class="sidebar-item" data-type="image">
                    <i class="fas fa-image"></i>
                    <span>Images</span>
                    <span id="images-count" class="sidebar-count">0</span>
                </button>
                <button class="sidebar-item" data-type="video">
                    <i class="fas fa-video"></i>
                    <span>Vidéos</span>
                    <span id="videos-count" class="sidebar-count">0</span>
                </button>
                <button class="sidebar-item" data-type="document">
                    <i class="fas fa-file-alt"></i>
                    <span>Documents</span>
                    <span id="documents-count" class="sidebar-count">0</span>
                </button>
            </div>

            <div class="sidebar-section">
                <button class="sidebar-item">
                    <i class="fas fa-history"></i>
                    <span>Historique</span>
                </button>
                <button class="sidebar-item">
                    <i class="fas fa-trash"></i>
                    <span>Corbeille</span>
                </button>
            </div>

             <div class="sidebar-section">
                <button class="sidebar-item">
                    <i class="fas fa-cog"></i>
                    <span>Paramètres</span>
                </button>
                <button class="sidebar-item">
                    <i class="fas fa-plus"></i>
                    <span>Aide & support</span>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Rechercher des fichiers..." id="searchInput">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="header-actions">
                    <div class="view-toggle">
                        <button class="active" data-view="grid">
                            <i class="fas fa-th"></i>
                        </button>
                        <button data-view="list">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Folders Section -->
                <div class="folders-section">
                    <h2 class="section-title">Dossiers</h2>
                    <div class="folders-grid" id="foldersGrid">
                        <div class="loading">Chargement des dossiers...</div>
                    </div>
                </div>

                <!-- Files Section -->
                <div class="files-section">
                    <div class="files-header">
                        <h3>Fichiers</h3>
                        <div class="files-controls">
                            <button id="refresh-btn">
                                <i class="fas fa-sync"></i> Actualiser
                            </button>
                        </div>
                    </div>
                    
                    <table class="files-table">
                        <thead>
                            <tr>
                                <th>Nom</th>
                                <th>Type</th>
                                <th>Taille</th>
                                <th>Modifié</th>
                                <th>Propriétaire</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="filesTableBody">
                            <tr>
                                <td colspan="6" class="loading">Chargement des fichiers...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
